name: Queue internal signing (self-hosted)
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after creating the reviewed matching version tag
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: queue-internal-signing
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'dataswarmproject/alnatheer-queue'
    runs-on: [self-hosted, Windows, X64, digital-trendz-signing]
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check local signing account before building
        shell: powershell
        run: |
          $record = Get-Content "$env:LOCALAPPDATA\AlnatheerQueue\WindowsSigning\signer.json" -Raw | ConvertFrom-Json
          $env:QUEUE_SIGNING_MODE = 'internal'
          $env:QUEUE_SIGNING_PUBLISHER = $record.publisher
          $env:QUEUE_SIGNING_CERT_SHA1 = $record.thumbprint
          powershell.exe -NoProfile -NonInteractive -File apps/queue-desktop/scripts/check-signing-readiness.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Local signing key unavailable; use the enrolled Windows account' }
      - name: Restore existing private build inputs
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_FONT_BUILD_KEY: ${{ secrets.QUEUE_FONT_BUILD_KEY }}
        run: |
          $inputDirectory = Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $inputDirectory | Out-Null
          gh release download queue-build-inputs --repo $env:GITHUB_REPOSITORY --pattern font-build-input.enc --pattern voice-library.zip --dir $inputDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Private build inputs unavailable' }
          node apps/queue-desktop/scripts/restore-build-inputs.cjs $inputDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Build input verification failed' }
          $voiceDirectory = Join-Path $inputDirectory 'voice'
          Expand-Archive -LiteralPath (Join-Path $inputDirectory 'voice-library.zip') -DestinationPath $voiceDirectory
          "QUEUE_FONT_ARCHIVE=$(Join-Path $inputDirectory 'fonts.zip')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QUEUE_VOICE_LIBRARY_DIRECTORY=$voiceDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify, package and sign locally without hosted runner charges
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_RELEASE_SIGNING_KEY: ${{ secrets.QUEUE_RELEASE_SIGNING_KEY }}
          PUBLISH_INTERNAL_RELEASE: ${{ inputs.publish }}
        run: |
          $publish = $env:PUBLISH_INTERNAL_RELEASE -eq 'true'
          $releaseArgs = @('-NoProfile','-NonInteractive','-File','apps/queue-desktop/scripts/invoke-internal-release.ps1','-ExpectedCommit',$env:GITHUB_SHA)
          if ($publish) { $releaseArgs += '-Publish' }
          powershell.exe @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Internal release qualification failed' }
